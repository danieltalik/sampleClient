spring:
  application:
    name: sampleClient
  cloud:
    openfeign:
      client:
        config:
          pets:
            connect-timeout: 5000 # milliseconds
            read-timeout: 10000   # milliseconds
            logger-level: full
            error-decoder: org.example.config.PetErrorDecoder

pets:
  name: pets
  url: ${PETS_URL:http://localhost:8085}

# Feign only prints request/response logs when the client's logger is at DEBUG.
logging:
  level:
    org.example.api: DEBUG
